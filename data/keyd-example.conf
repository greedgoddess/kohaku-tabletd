# Example /etc/keyd/default.conf for the Galaxy Chromebook keyboard.
# "scale" is the 5th top-row key (overview). keyd runs commands as root;
# --active-user hands the call to the logged-in session.
[ids]
0001:0001

[main]
zoom = f11
scale = command(/usr/bin/kohaku-tabletd --active-user toggle)
sleep = M-l

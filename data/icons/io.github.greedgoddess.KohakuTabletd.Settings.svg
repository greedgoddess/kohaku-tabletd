<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8d488"/>
      <stop offset="1" stop-color="#e5a03a"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
  </defs>
  <!-- base / keyboard deck -->
  <rect x="8" y="98" width="112" height="16" rx="6" fill="#241f31"/>
  <rect x="8" y="96" width="112" height="14" rx="6" fill="url(#base)"/>
  <rect x="52" y="96" width="24" height="4" rx="2" fill="#241f31" opacity=".6"/>
  <!-- lid -->
  <rect x="14" y="14" width="100" height="82" rx="10" fill="#b8741a"/>
  <rect x="14" y="12" width="100" height="82" rx="10" fill="url(#lid)"/>
  <!-- screen -->
  <rect x="22" y="20" width="84" height="64" rx="5" fill="#fff8ea"/>
  <!-- zoom: expand arrows to the corners -->
  <g fill="none" stroke="#c97b14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54 46 L36 32"/>
    <path d="M35 44 V31 H48"/>
    <path d="M74 58 L92 72"/>
    <path d="M93 60 V73 H80"/>
  </g>
  <!-- small window being zoomed -->
  <rect x="54" y="45" width="20" height="14" rx="2.5" fill="#e5a03a"/>
</svg>
